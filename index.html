<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; margin-top: 40px;}
    .attribution a { color: hsl(228, 45%, 44%); }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: hsl(212, 45%, 89%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;

    }

    .container {
      /* border: 1px solid black; */
      padding: 0.5rem;
      width: 300px;
      height: 450px;
      background-color: hsl(0, 0%, 100%);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;

      .card{
        /* border: 1px solid red; */
        padding: 2px;
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        /* justify-content: center; */
        text-align: center;
        gap: 1rem;
        
        img {
          border-radius: 8px;
          width: 100%;
          /* height: ; */
        }

        .title {
          font-size: 20px;
        }

        .description {
          font-size: 15px;
          color: hsl(216, 15%, 48%);
        }
      }
    }

  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <img src="./images/image-qr-code.png" alt="QR Code" class="qr-code">
      <div class="text">
        <h1 class="title">Improve your front-end <br> skills by building projects</h1>
        <p class="description">Scan the QR code to visit Frontend <br> Mentor and take your coding skills to <br> the next level</p>
      </div>
    </div>
  </div>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">MlsCisse</a>.
  </footer>
</body>
</html>
